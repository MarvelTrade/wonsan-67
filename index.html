<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>원산-67 · ВОНСАН-67</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1d241f;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; }
    /* Телефон стоя: игра горизонтальная — просим повернуть */
    #rotate { display: none; position: fixed; inset: 0; z-index: 5; background: #1d241f; color: #f4f0e4;
      font: 22px Arial, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
